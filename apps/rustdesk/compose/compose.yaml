services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    restart: unless-stopped
    network_mode: host
    command: ["hbbs", "-r", "${RUSTDESK_DOMAIN:-example.com}:${RUSTDESK_RELAY_PORT:-21117}", "-k", "_"]
    volumes:
      - ./data:/root
    depends_on:
      - hbbr

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    restart: unless-stopped
    network_mode: host
    command: ["hbbr", "-k", "_"]
    volumes:
      - ./data:/root