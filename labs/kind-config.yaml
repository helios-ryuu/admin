kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# 1. Đặt tên mặc định cho Cluster (Nếu không dùng flag --name khi chạy lệnh)
name: training-cluster

# 2. Tùy chỉnh Network (CIDR, CNI mặc định)
networking:
  ipFamily: ipv4                   # ipv4, ipv6, hoặc dual
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

# 3. Danh sách các Nodes và tùy chỉnh chi tiết từng Node
nodes:
  # --- CONTROL PLANE NODE ---
  - role: control-plane
    image: kindest/node:v1.36.1

  # --- WORKER NODES ---
  - role: worker
    image: kindest/node:v1.36.1

  - role: worker
    image: kindest/node:v1.36.1